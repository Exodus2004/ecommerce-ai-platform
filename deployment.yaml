# ====================================================================
# Kubernetes Deployments: 5 Microservices Architecture
# ====================================================================
# 1. api-gateway               (Edge Gateway & Web UI)
# 2. catalog-service           (Product Data & Inventory)
# 3. search-service            (AI Semantic Search Optimization)
# 4. recommendation-service   (AI Content-Based Recommender)
# 5. chatbot-service          (AI Conversational Shopping Concierge)
# ====================================================================

# --------------------------------------------------------------------
# 1. API Gateway Microservice Deployment
# --------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  labels:
    app: api-gateway
    tier: frontend-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: shopsmart-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:8001"
            - name: SEARCH_SERVICE_URL
              value: "http://search-service:8002"
            - name: RECOMMENDATION_SERVICE_URL
              value: "http://recommendation-service:8003"
            - name: CHATBOT_SERVICE_URL
              value: "http://chatbot-service:8004"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

---
# --------------------------------------------------------------------
# 2. Product Catalog Microservice Deployment
# --------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service-deployment
  labels:
    app: catalog-service
    tier: core-domain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: shopsmart-catalog:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10

---
# --------------------------------------------------------------------
# 3. AI Search Optimization Microservice Deployment
# --------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service-deployment
  labels:
    app: search-service
    tier: ai-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: shopsmart-search:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:8001"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10

---
