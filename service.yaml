# ====================================================================
# Kubernetes Services: 5 Microservices + Polyglot Databases
# ====================================================================
# - 1 Public Service (api-gateway-service) exposed via LoadBalancer (Port 80)
# - 6 Private Internal Services (ClusterIP) for secure database & inter-service traffic
# ====================================================================

# --------------------------------------------------------------------
# 1. API Gateway Service (Public LoadBalancer - Port 80)
# --------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  labels:
    app: api-gateway
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 80             # Public internet port
      targetPort: 8000     # Gateway container port

---
# --------------------------------------------------------------------
# 2. PostgreSQL Internal Database Service (ClusterIP)
# --------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432

---
# --------------------------------------------------------------------
# 3. MongoDB Internal Database Service (ClusterIP)
# --------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  labels:
    app: mongodb
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongodb
      protocol: TCP
      port: 27017
      targetPort: 27017

---
# --------------------------------------------------------------------
# 4. Product Catalog Internal Service (ClusterIP)
# --------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  labels:
    app: catalog-service
spec:
  type: ClusterIP
  selector:
    app: catalog-service
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001

---
# --------------------------------------------------------------------
# 5. AI Search Optimization Internal Service (ClusterIP)
# --------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: search-service
  labels:
    app: search-service
spec:
  type: ClusterIP
  selector:
    app: search-service
  ports:
    - name: http
      protocol: TCP
      port: 8002
      targetPort: 8002

---
# --------------------------------------------------------------------
# 6. AI Recommendation Internal Service (ClusterIP)
# --------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  labels:
    app: recommendation-service
spec:
  type: ClusterIP
  selector:
    app: recommendation-service
  ports:
    - name: http
      protocol: TCP
      port: 8003
      targetPort: 8003

---
# --------------------------------------------------------------------
# 7. AI Chatbot Internal Service (ClusterIP)
# --------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  labels:
    app: chatbot-service
spec:
  type: ClusterIP
  selector:
    app: chatbot-service
  ports:
    - name: http
      protocol: TCP
      port: 8004
      targetPort: 8004
