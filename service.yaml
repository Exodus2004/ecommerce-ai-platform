# ====================================================================
# Kubernetes Services: 5 Microservices Networking
# ====================================================================
# - 1 Public Service (api-gateway-service) exposed via LoadBalancer (Port 80)
# - 4 Private Internal Services (ClusterIP) for secure microservice-to-microservice traffic
# ====================================================================

# --------------------------------------------------------------------
# 1. API Gateway Service (Public LoadBalancer)
# --------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  labels:
    app: api-gateway
spec:
  # Type LoadBalancer: Provisions a public Cloud IP for external users
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 80             # Public internet port
      targetPort: 8000     # Gateway container port

---
# --------------------------------------------------------------------
# 2. Product Catalog Internal Service (ClusterIP)
# --------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  labels:
    app: catalog-service
spec:
  type: ClusterIP
  selector:
    app: catalog-service
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001

---
# --------------------------------------------------------------------
# 3. AI Search Optimization Internal Service (ClusterIP)
# --------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: search-service
  labels:
    app: search-service
spec:
  type: ClusterIP
  selector:
    app: search-service
  ports:
    - name: http
      protocol: TCP
      port: 8002
      targetPort: 8002

---
# --------------------------------------------------------------------
# 4. AI Recommendation Internal Service (ClusterIP)
# --------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  labels:
    app: recommendation-service
spec:
  type: ClusterIP
  selector:
    app: recommendation-service
  ports:
    - name: http
      protocol: TCP
      port: 8003
      targetPort: 8003

---
# --------------------------------------------------------------------
# 5. AI Chatbot Internal Service (ClusterIP)
# --------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  labels:
    app: chatbot-service
spec:
  type: ClusterIP
  selector:
    app: chatbot-service
  ports:
    - name: http
      protocol: TCP
      port: 8004
      targetPort: 8004
