version: '3.8'

services:
  # ------------------------------------------------------------------
  # Database 1: PostgreSQL Relational Database (for Catalog Service)
  # ------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: shopsmart-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: catalog_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Database 2: MongoDB NoSQL Document Database (for Chatbot Service)
  # ------------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: shopsmart-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ------------------------------------------------------------------
  # Microservice 1: Product Catalog (Port 8001)
  # ------------------------------------------------------------------
  catalog-service:
    build: ./services/catalog
    container_name: shopsmart-catalog
    restart: always
    ports:
      - "8001:8001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: catalog_db
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Microservice 2: AI Search Engine (Port 8002)
  # ------------------------------------------------------------------
  search-service:
    build: ./services/search
    container_name: shopsmart-search
    restart: always
    ports:
      - "8002:8002"
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8001
    depends_on:
      - catalog-service

  # ------------------------------------------------------------------
  # Microservice 3: AI Recommendation Engine (Port 8003)
  # ------------------------------------------------------------------
  recommendation-service:
    build: ./services/recommendation
    container_name: shopsmart-recommendation
    restart: always
    ports:
      - "8003:8003"
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8001
    depends_on:
      - catalog-service

  # ------------------------------------------------------------------
  # Microservice 4: AI Chatbot & Conversation History (Port 8004)
  # ------------------------------------------------------------------
  chatbot-service:
    build: ./services/chatbot
    container_name: shopsmart-chatbot
    restart: always
    ports:
      - "8004:8004"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB_NAME: shopsmart_chat_db
      CATALOG_SERVICE_URL: http://catalog-service:8001
    depends_on:
      - mongodb
      - catalog-service

  # ------------------------------------------------------------------
  # Microservice 5: API Gateway & Storefront Web UI (Port 8000)
  # ------------------------------------------------------------------
  api-gateway:
    build: ./services/gateway
    container_name: shopsmart-gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8001
      SEARCH_SERVICE_URL: http://search-service:8002
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8003
      CHATBOT_SERVICE_URL: http://chatbot-service:8004
    depends_on:
      - catalog-service
      - search-service
      - recommendation-service
      - chatbot-service

volumes:
  postgres_data:
  mongo_data:
